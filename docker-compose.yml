version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daksetu-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite:///./daksetu.db
    volumes:
      - daksetu-data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daksetu-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  daksetu-data:
